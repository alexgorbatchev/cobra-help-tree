name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      # CI runs the same recipes a developer runs, so the checks cannot drift
      # apart from the ones documented in AGENTS.md.
      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Verify dependencies
        run: go mod verify

      # Formatting, vet and module hygiene, then the tests under -race with the
      # statement coverage floor enforced; the job fails on any of them.
      - name: Run linters, tests, and the coverage floor
        run: just check
